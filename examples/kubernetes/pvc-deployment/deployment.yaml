apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-awesome-deployment
spec:
  selector:
    matchLabels:
      app: my-awesome-deployment
  replicas: 3
  template:
    metadata:
      labels:
        app: my-awesome-deployment
    spec:
      containers:
        - name: my-awesome-nginx
          image: nginx
          volumeMounts:
            - mountPath: "/usr/share/nginx/html"
              name: my-awesome-html
          ports:
            - containerPort: 80
      volumes:
        - name: my-awesome-html
          persistentVolumeClaim:
            claimName: my-awesome-pvc
